[package]
name = "minka-syu"
version = "0.2.0"
edition = "2021"
description = "MinkaSyu core: safe update checking (repos + AUR) with repository provenance; applying is paru's job"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
