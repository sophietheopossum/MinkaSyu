[package]
name = "minka-syu-gui"
version = "0.1.0"
edition = "2024"
description = "MinkaSyu's window (AntiWebUI): a view over `minka-syu serve`"
license = "MIT"

[[bin]]
name = "minka-syu-gui"
path = "src/main.rs"

[dependencies]
# The toolkit is MinkaDE's AntiWebUI submodule, a sibling of this repository, so every Minka
# app builds the same revision and a toolkit fix reaches them all.
anti-webui = { path = "../../AntiWebUI/src/anti-webui", default-features = false, features = ["wayland", "svg"] }
anti-webui-md3e = { path = "../../AntiWebUI/src/anti-webui-md3e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
