[package]
name = "minka-syu"
version = "0.6.0"
edition = "2021"
description = "MinkaSyu core: safe update checking (repos + AUR) with repository provenance; applying is paru's job"
license = "MIT"

# A library: MinkaDE's one binary (minka/, at the top of the checkout) runs it
# under the name it was started as. Nothing is built from here alone.
[lib]
name = "minka_syu"
path = "src/lib.rs"
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
